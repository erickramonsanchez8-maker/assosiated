function identityDrawLogoPlane(ctx,d,q){
 const p0=q[0],p1=q[1],p3=q[3],pw=100,ph=60;
 const left={x:p0.x+(p1.x-p0.x)*.15+(p3.x-p0.x)*.18,y:p0.y+(p1.y-p0.y)*.15+(p3.y-p0.y)*.18};
 const right={x:p0.x+(p1.x-p0.x)*.85+(p3.x-p0.x)*.18,y:p0.y+(p1.y-p0.y)*.85+(p3.y-p0.y)*.18};
 const bottom={x:p0.x+(p1.x-p0.x)*.15+(p3.x-p0.x)*.80,y:p0.y+(p1.y-p0.y)*.15+(p3.y-p0.y)*.80};
 ctx.save();
 ctx.transform((right.x-left.x)/pw,(right.y-left.y)/pw,(bottom.x-left.x)/ph,(bottom.y-left.y)/ph,left.x,left.y);
 const img=identityLogoImage(d);
 if(img){
  const ar=img.naturalWidth/img.naturalHeight;
  let iw=70,ih=iw/ar;
  if(ih>43){ih=43;iw=ih*ar}
  ctx.globalAlpha=.97;ctx.drawImage(img,(pw-iw)/2,(ph-ih)/2,iw,ih);
 }else{
  ctx.fillStyle=identityInk(d.primary);ctx.textAlign='center';ctx.textBaseline='middle';

function identityPaintSurface(ctx,d,surface,w,h){

 for(let i=1;i<q.length;i++)ctx.lineTo(q[i].x,q[i].y);
 ctx.closePath();ctx.clip();
 const base=surface==='laptop'?d.primary:(surface==='box'?d.secondary:(surface==='bottle'?d.paper:d.paper));
 ctx.globalAlpha=surface==='laptop'?.66:(surface==='bottle'?.54:(surface==='box'?.61:.78));
 ctx.fillStyle=base;ctx.fillRect(0,0,w,h);
 ctx.globalAlpha=1;
 const shine=ctx.createLinearGradient(q[0].x,q[0].y,q[2].x,q[2].y);
 shine.addColorStop(0,'rgba(255,255,255,.24)');
 shine.addColorStop(.46,'rgba(255,255,255,.02)');

 ctx.fillStyle=shine;ctx.fillRect(0,0,w,h);

function identityPaintScene(scene){
 if(!scene)return;
 const img=scene.querySelector('.id-scene-photo'),canvas=scene.querySelector('.id-photo-composite');
 if(!img||!canvas||!img.complete||!img.naturalWidth)return;
 try{
  const rect=scene.getBoundingClientRect();
  const targetRatio=Math.max(.3,rect.width/Math.max(1,rect.height));
  const maxOut=1600,imgRatio=img.naturalWidth/img.naturalHeight;
  let w,h;
  if(imgRatio>targetRatio){h=Math.min(img.naturalHeight,Math.round(maxOut/targetRatio));w=Math.round(h*targetRatio)}
  else{w=Math.min(img.naturalWidth,maxOut);h=Math.round(w/targetRatio)}
  w=Math.max(2,w);h=Math.max(2,h);
  canvas.width=w;canvas.height=h;canvas.style.display='block';
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,w,h);
  const boxRatio=w/h;
  let sx=0,sy=0,sw=img.naturalWidth,sh=img.naturalHeight;
  if(imgRatio>boxRatio){sw=img.naturalHeight*boxRatio;sx=(img.naturalWidth-sw)/2}
  else{sh=img.naturalWidth/boxRatio;sy=(img.naturalHeight-sh)/2}
  ctx.drawImage(img,sx,sy,sw,sh,0,0,w,h);
  const d=Object.assign({},IDENTITY_DEFAULTS,S.identityStudio||{});
  const grade=ctx.createLinearGradient(0,0,w,h);
  grade.addColorStop(0,dColorAlpha(d.primary,.20));
  grade.addColorStop(.52,dColorAlpha(d.secondary,.04));
  grade.addColorStop(1,dColorAlpha(d.accent,.18));
  ctx.globalCompositeOperation='soft-light';ctx.fillStyle=grade;ctx.fillRect(0,0,w,h);
  ctx.globalCompositeOperation='source-over';
  const surface=scene.dataset.surface||'';
  if(surface)identityPaintSurface(ctx,d,surface,w,h);
  img.style.opacity='0';canvas.style.display='block';
 }catch(err){
  canvas.style.display='none';img.style.opacity='1';
 }
}
function dColorAlpha(hex,alpha){

async function manageHesedUsers(){if(!HESED_EMAIL||!users()[HESED_EMAIL])return;const email=prompt('Correo del segundo propietario para el acceso HESED:');if(email===null)return;const em=email.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(em)){alert('Escribe un correo válido.');return}const U=users();if(U[em]){alert('Ese usuario ya tiene acceso a HESED.');return}const name=prompt('Nombre del propietario:');if(name===null)return;if(!name.trim()){alert('Escribe un nombre.');return}const password=prompt('Contraseña inicial de HESED (mínimo 8 caracteres):');if(password===null)return;if(password.length<8){alert('La contraseña debe tener al menos 8 caracteres.');return}if(!window.crypto||!crypto.subtle){alert('Este navegador no permite crear el acceso.');return}const salt=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();U[em]={name:name.trim(),salt,hash:await hp(password,salt),onboardingPending:false};if(!setUsers(U)){alert('No se pudo guardar el acceso.');return}alert('Usuario de HESED creado. Comparte las credenciales directamente con el segundo propietario.');}
const DIVISION_META={SHALOM:{name:'SHALOM',sub:'Restaurante · gestión comercial y operativa',accent:'#c9a879',symbol:'S',brand:'SHALOM · SABOR Y PAZ'},BEFIT:{name:'BEFIT',sub:'Gimnasio · gestión operativa y financiera',accent:'#9bd9bd',symbol:'B',brand:'BEFIT · FITNESS MANAGEMENT'},LA_HUERTA:{name:'LA HUERTA',sub:'Agricultura · AGROVA / Mi Parcela',accent:'#a8c77d',symbol:'H',brand:'LA HUERTA · OPERACIÓN AGRÍCOLA'}};
function divisionUsers(company){try{return JSON.parse(localStorage.getItem('hesed:division-users:'+company))||{}}catch(e){return{}}}
async function divisionHash(password,salt){const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+'|'+password));return Array.from(new Uint8Array(bytes)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function openHesedCompany(company){
 const meta=DIVISION_META[company];if(!meta)return;
 // LA HUERTA ya tiene autenticación propia dentro de Mi Parcela; no duplicar la pantalla de acceso.
 if(company==='LA_HUERTA'||company==='BEFIT'){openHesedCompanyUnlocked(company);return;}
 const accounts=divisionUsers(company),first=!Object.keys(accounts).length;
 document.getElementById('hesed-home')?.remove();document.getElementById('hesed-company-bar')?.remove();
 document.body.classList.add('noauth');document.body.classList.remove('onboarding-mode');
 const main=document.getElementById('main');if(!main)return;
 main.innerHTML='<section class="division-auth" style="--division-accent:'+meta.accent+'"><div class="brandline">HESED / Acceso de unidad</div><h1>'+meta.name+'</h1><p>'+meta.sub+'</p><div style="height:3px;width:54px;background:'+meta.accent+';margin:18px 0"></div><form id="divisionAuthForm"><label>Usuario<input name="username" autocomplete="username" minlength="3" maxlength="60" required placeholder="Tu usuario"></label><label>Contraseña<input name="password" type="password" autocomplete="'+(first?'new-password':'current-password')+'" minlength="8" required placeholder="Mínimo 8 caracteres"></label>'+ (first?'<label>Nombre del responsable<input name="displayName" autocomplete="name" maxlength="80" required placeholder="Nombre del responsable"></label>':'') +'<p class="division-error" id="divisionError" role="alert"></p><button class="division-primary" type="submit">'+(first?'Crear primer acceso':'Entrar a '+meta.name)+'</button></form><div class="division-actions"><button type="button" class="division-secondary" id="divisionBack">← Volver a HESED</button></div><p class="division-foot">'+(first?'Primer uso: crea el acceso inicial de esta unidad. Después de entrar podrás agregar el acceso del segundo propietario.':'Acceso separado del inicio de sesión principal de HESED. Las credenciales de esta unidad no sirven para las otras.')+'<br>Prototipo local: las credenciales se guardan en este navegador; todavía no es autenticación de servidor.</p></section>';
 document.getElementById('divisionBack').onclick=showHesedHome;
 document.getElementById('divisionAuthForm').addEventListener('submit',async ev=>{
  ev.preventDefault();const form=new FormData(ev.currentTarget),username=String(form.get('username')||'').trim().toLowerCase(),password=String(form.get('password')||''),err=document.getElementById('divisionError');
  if(!window.crypto||!crypto.subtle){err.textContent='Este navegador no permite verificar contraseñas. Abre el sistema en una versión actualizada de Edge o Chrome.';return}
  if(!/^[a-z0-9._-]{3,60}$/.test(username)){err.textContent='Usa al menos 3 caracteres: letras, números, punto, guion o guion bajo.';return}
  if(password.length<8){err.textContent='La contraseña debe tener al menos 8 caracteres.';return}
  const current=divisionUsers(company);
  if(!Object.keys(current).length){
   const salt=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();
   current[username]={username,displayName:String(form.get('displayName')||'').trim(),salt,hash:await divisionHash(password,salt),createdAt:new Date().toISOString()};
   try{localStorage.setItem('hesed:division-users:'+company,JSON.stringify(current))}catch(e){err.textContent='No se pudieron guardar los accesos en este navegador.';return}
  }else{
   const account=current[username];if(!account||account.hash!==await divisionHash(password,account.salt)){err.textContent='Usuario o contraseña incorrectos para '+meta.name+'.';return}
  }
  window.HESED_DIVISION_SESSION={company,username,displayName:current[username]?.displayName||username,authenticatedAt:Date.now()};
  try{localStorage.setItem('hesed:division-session:'+company,JSON.stringify({username,expiresAt:Date.now()+30*60*1000}))}catch(e){}
  openHesedCompanyUnlocked(company);
 });
}
function manageDivisionUsers(){
 const session=window.HESED_DIVISION_SESSION;if(!session)return;
 const meta=DIVISION_META[session.company],accounts=divisionUsers(session.company);
 const username=prompt('Nuevo usuario para '+meta.name+' (3 a 60 caracteres; letras, números, punto, guion o guion bajo):');if(username===null)return;
 const key=username.trim().toLowerCase();if(!/^[a-z0-9._-]{3,60}$/.test(key)){alert('Nombre de usuario no válido.');return}
 if(accounts[key]){alert('Ese usuario ya existe en esta unidad.');return}
 const displayName=prompt('Nombre del responsable:');if(displayName===null)return;
 const password=prompt('Contraseña inicial (mínimo 8 caracteres):');if(password===null)return;
 if(password.length<8){alert('La contraseña debe tener al menos 8 caracteres.');return}
 (async()=>{const salt=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();accounts[key]={username:key,displayName:displayName.trim(),salt,hash:await divisionHash(password,salt),createdAt:new Date().toISOString()};try{localStorage.setItem('hesed:division-users:'+session.company,JSON.stringify(accounts));alert('Acceso agregado a '+meta.name+'. Comparte las credenciales directamente con el segundo propietario.')}catch(e){alert('No se pudo guardar el nuevo acceso.')}})();
}
function openHesedCompanyUnlocked(company){
 HESED_COMPANY=company;
 document.getElementById('hesed-home')?.remove();
 document.body.classList.remove('noauth');
 const legacyHeader=document.querySelector('.hd');
 const oldbar=document.getElementById('hesed-company-bar');if(oldbar)oldbar.remove();
 const main=document.getElementById('main');if(!main)return;
 if(company!=='SHALOM'){
  document.body.classList.add('hesed-module-active');
  if(legacyHeader)legacyHeader.style.display='none';
  const huerta=company==='LA_HUERTA',title=huerta?'LA HUERTA':'BEFIT',divisionMeta=DIVISION_META[company]||DIVISION_META.BEFIT;
  if(huerta){
   main.innerHTML='<div class="hesed-embedded-shell" id="hesed-huerta-shell"><div class="hesed-module-loading" role="status">Preparando Mi Parcela…</div></div>';
   const frame=document.createElement('iframe');frame.id='hesed-huerta-frame';frame.title='HESED · LA HUERTA · Mi Parcela';frame.setAttribute('loading','eager');frame.setAttribute('allow','clipboard-read; clipboard-write');frame.style.cssText='display:block;width:100%;height:100%;min-height:500px;border:0;background:#f5f2eb';
   frame.addEventListener('load',()=>{const loading=document.querySelector('#hesed-huerta-shell .hesed-module-loading');if(loading)loading.remove();});
