<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Panel privado | SHALOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>:root{--bg:#F7F5EF;--green:#2E3A33;--line:#ded7cc;--muted:#716f69}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#171717;font:14px/1.5 Montserrat,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px 16px}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:18px}.head h1{font:32px 'Playfair Display',serif;margin:0}.muted{color:var(--muted);font-size:12px}.panel{background:#fffdf8;border:1px solid var(--line);padding:20px;margin:20px 0}.field{display:flex;gap:10px;flex-wrap:wrap}.field input{flex:1;min-width:230px;padding:12px;border:1px solid var(--line);font:inherit}.button,select{padding:10px 12px;border:1px solid var(--green);background:var(--green);color:white;font:inherit;cursor:pointer}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{background:transparent;color:var(--green)}.tabs button.active{background:var(--green);color:white}.msg{white-space:pre-wrap;font-size:12px;margin-top:10px}.card{padding:16px 0;border-bottom:1px solid var(--line)}.card h3{margin:0 0 6px;font-size:15px}.meta{color:var(--muted);font-size:12px}.details{white-space:pre-wrap;font-size:12px;margin:8px 0}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.actions select{background:white;color:#222;border-color:var(--line)}@media(max-width:600px){.head{align-items:flex-start;flex-direction:column}.panel{padding:14px}}</style></head>
<body><main class="wrap"><header class="head"><div><h1>Shalom.</h1><div class="muted">Panel privado de pedidos y reservaciones</div></div><a href="shalom-tienda.html">Ver tienda ↗</a></header>
<section class="panel"><h2>Acceso del personal</h2><p class="muted">Ingresa la clave privada que configuraste en Hostinger. No uses este panel en computadoras públicas y no compartas la clave.</p><div class="field"><input id="key" type="password" autocomplete="current-password" placeholder="Clave privada del panel"><button id="connect" class="button">Entrar</button><button id="logout" class="button" type="button">Cerrar sesión</button></div><div id="message" class="msg" role="status"></div></section>
<section class="panel"><div class="tabs"><button class="button active" data-view="orders">Pedidos</button><button class="button" data-view="reservations">Reservaciones</button><button class="button" id="refresh">Actualizar</button></div><div id="list" style="margin-top:16px"><p class="muted">Entra con la clave para consultar los registros.</p></div></section></main>
<script>
(function(){let key="",view="orders";const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function say(t){$("message").textContent=t}
async function request(url,options={}){const r=await fetch(url,{...options,headers:{"Content-Type":"application/json","x-admin-key":key,...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"No se pudo completar la operación.");return d}
async function load(){if(!key){say("Introduce la clave privada.");return}const host=view==="orders"?"/api/admin/orders":"/api/admin/reservations";$("list").innerHTML="<p class='muted'>Cargando…</p>";try{const data=await request(host);if(!data.length){$("list").innerHTML="<p class='muted'>Todavía no hay registros.</p>";return} $("list").innerHTML=data.map(x=>{const order=view==="orders";const title=order?"Pedido #"+x.id:"Reservación #"+x.id;const when=order?x.created_at:(x.reservation_date+" · "+String(x.reservation_time).slice(0,5));const details=order?(x.items||[]).map(i=>i.name+" × "+i.quantity+" — "+(i.unitPrice==null?"precio por confirmar":"$"+Number(i.unitPrice).toFixed(2))).join("\n")+"\nModalidad: "+x.fulfilment+"\nDirección: "+x.address:"Fecha y hora: "+when+"\nPersonas: "+x.guests+"\nCorreo: "+x.email;const status=x.status;const statuses=order?["pendiente","confirmado","en preparación","listo","entregado","cancelado"]:["pendiente","confirmada","rechazada","cancelada","atendida"];return "<article class='card'><h3>"+esc(title)+" · "+esc(x.customer_name)+"</h3><div class='meta'>"+esc(when)+" · Tel. "+esc(x.phone)+" · Estado: <b>"+esc(status)+"</b></div><div class='details'>"+esc(details)+"\nNotas: "+esc(x.notes)+"</div><div class='actions'><select id='status-"+esc(x.id)+"'>"+statuses.map(s=>"<option "+(s===status?"selected":"")+" value='"+esc(s)+"'>"+esc(s)+"</option>").join("")+"</select><button class='button' data-save='"+esc(x.id)+"'>Guardar estado</button></div></article>" }).join("");$("list").querySelectorAll("[data-save]").forEach(b=>b.addEventListener("click",async()=>{const id=b.dataset.save;try{await request("/api/admin/"+view+"/"+id+"/status",{method:"PATCH",body:JSON.stringify({status:$("status-"+id).value})});say("Estado actualizado.");await load()}catch(e){say(e.message)}}));say("Registros cargados.")}catch(e){$("list").innerHTML="";say(e.message)}}
$("connect").addEventListener("click",async()=>{key=$("key").value.trim();try{await request("/api/health");say("Conexión con la página correcta. Cargando registros…");await load()}catch(e){say(e.message)}});
$("logout").addEventListener("click",()=>{key="";$("key").value="";$("list").innerHTML="<p class='muted'>Sesión cerrada. La clave no se guarda en el navegador.</p>";say("Sesión cerrada.")});
document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>{view=b.dataset.view;document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("active",x===b));load()}));$("refresh").addEventListener("click",load);
})();
</script></body></html>
