name: BEFIT control checks

on:
  pull_request:
    paths:
      - "docs/befit.html"
      - "docs/befit-control.js"
      - "docs/test-data/**"
      - "scripts/test-befit-control.mjs"
      - ".github/workflows/befit-control.yml"
  push:
    branches:
      - main
      - feat/befit-admin-reconciliation
    paths:
      - "docs/befit.html"
      - "docs/befit-control.js"
      - "docs/test-data/**"
      - "scripts/test-befit-control.mjs"
      - ".github/workflows/befit-control.yml"

jobs:
  befit-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check docs/befit-control.js
      - name: Run BEFIT smoke tests
        run: node scripts/test-befit-control.mjs
