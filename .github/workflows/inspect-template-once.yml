name: Inspect blank weekly template

on:
  push:
    branches:
      - feat/befit-admin-reconciliation
    paths:
      - "FORMATO SEMANAL.xlsx"
      - ".github/workflows/inspect-template-once.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect workbook structure
        run: |
          npm init -y
          npm install xlsx
          node <<'NODE'
          const XLSX = require('xlsx');
          const wb = XLSX.readFile('FORMATO SEMANAL.xlsx', { cellFormula: true, cellStyles: true });
          const result = { sheetNames: wb.SheetNames, sheets: {} };
          for (const name of wb.SheetNames) {
            const ws = wb.Sheets[name];
            const cells = {};
            for (const [address, cell] of Object.entries(ws)) {
              if (address.startsWith('!')) continue;
              if (cell.v !== undefined || cell.f !== undefined) {
                cells[address] = { value: cell.w ?? cell.v ?? null, formula: cell.f ?? null, type: cell.t ?? null };
              }
            }
            result.sheets[name] = {
              dimension: ws['!ref'] ?? null,
              merges: ws['!merges'] ?? [],
              nonEmptyCells: cells,
              rows: XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '', blankrows: false })
            };
          }
          console.log('WORKBOOK_INSPECTION_BEGIN');
          console.log(JSON.stringify(result));
          console.log('WORKBOOK_INSPECTION_END');
          NODE
